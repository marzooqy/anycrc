[project]
name = "anycrc"
version = "2.0.0"
description = "The fastest general Python CRC Library"
readme = "README.md"
license = "Zlib"
requires-python = ">=3.9"

[project.optional-dependencies]
bits = ["bitarray"]

[project.urls]
"Homepage" = "https://github.com/marzooqy/anycrc"

[build-system]
requires = ["setuptools", "cython"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = ["cp39-*", "cp310-*", "cp311-*", "cp314t-*", "cp315t*"]