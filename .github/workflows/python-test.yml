name: Test Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  py_version_test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            python -m pip install .
    - name: Run test
      run: python test.py

  bitarray_version_test:
    name: Test with ${{ matrix.bitarray-spec }}
    runs-on: windows-latest
    strategy:
      matrix:
        bitarray-spec: ["bitarray==3.4.0", "bitarray==3.8.0", "bitarray"]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            python -m pip install ${{ matrix.bitarray-spec }} .
    - name: Run test
      run: python test.py

  os_test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: "Windows (x64)"
            runner: windows-latest
            architecture: "x64"

          - os: "Windows (x86)"
            runner: windows-latest
            architecture: "x86"

          - os: "MacOS"
            runner: macos-latest

          - os: "Ubuntu"
            runner: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        architecture: ${{ matrix.architecture }}
    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            python -m pip install .
    - name: Run test
      run: python test.py
