name: Test Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  py_version_test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            python -m pip install .
    - name: Run test
      run: python test.py

  bitarray_version_test:
    name: Test with ${{ matrix.bitarray-spec }} (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - python-version: "3.8"
            bitarray-spec: "bitarray==1.1.0"
          - python-version: "3.9"
            bitarray-spec: "bitarray==1.4.1"
          - python-version: "3.10"
            # bitarray changelog says py310 support was added in 1.6.2, but the sdist is broken
            bitarray-spec: "bitarray==1.6.3"
          - python-version: "3.11"
            bitarray-spec: "bitarray==2.3.6"
          - python-version: "3.12"
            bitarray-spec: "bitarray==2.7.3"
          - python-version: "3.13"
            bitarray-spec: "bitarray==2.9.3"
          - python-version: "3.14"
            bitarray-spec: "bitarray==3.7.2"
          - python-version: "3.8"
            bitarray-spec: "bitarray"
          - python-version: "3.14"
            bitarray-spec: "bitarray"
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            python -m pip install ${{ matrix.bitarray-spec }} .
    - name: Run test
      run: python test.py

  os_test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: "Windows (x64)"
            runner: windows-latest
            architecture: "x64"

          - os: "Windows (x86)"
            runner: windows-latest
            architecture: "x86"

          - os: "MacOS"
            runner: macos-latest

          - os: "Ubuntu"
            runner: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        architecture: ${{ matrix.architecture }}
    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            python -m pip install .
    - name: Run test
      run: python test.py
