name: Test Module

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  py_version_test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15-dev", "3.14t", "3.15t-dev"]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install bitarray .
    - name: Run test
      run: python test.py

  os_test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: "Windows (x64)"
            runner: windows-latest
            architecture: "x64"

          - os: "Windows (x86)"
            runner: windows-latest
            architecture: "x86"

          - os: "MacOS"
            runner: macos-latest

          - os: "Ubuntu"
            runner: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        architecture: ${{ matrix.architecture }}
    - name: Install dependencies
      run: python -m pip install bitarray .
    - name: Run test
      run: python test.py

  ba_test:
    name: Test ${{ matrix.test-desc }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - test-desc: without bitarray
            bitarray-version: ""
          - test-desc: with bitarray 3.3.2
            bitarray-version: "bitarray==3.3.2"
          - test-desc: with bitarray
            bitarray-version: "bitarray"
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install ${{ matrix.bitarray-version }} .
    - name: Run test
      run: python test.py